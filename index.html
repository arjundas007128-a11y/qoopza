<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qoopza | Online Shopping</title><meta name="description" content="Shop everyday favourites at Qoopza."><style>
:root{--blue:#1769d2;--bg:#f3f6fc;--line:#dfe6f0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17243a}header{background:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px #14294b12}.logo{font-size:29px;font-weight:800;color:var(--blue)}.logo span{color:#f2bd28}button{border:0;border-radius:12px;padding:12px 16px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.secondary{background:#edf3fc;color:#10284b;border:1px solid var(--line)}main{max-width:1100px;margin:24px auto;padding:0 16px}.hero{background:linear-gradient(120deg,#164b9c,#2689ef);color:white;border-radius:24px;padding:36px;margin-bottom:28px}.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.product-icon{font-size:54px;background:#f0f5fd;border-radius:14px;text-align:center;padding:18px}.price{font-size:20px;font-weight:800;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#08172a99;display:grid;place-items:center;padding:16px;z-index:5}.modalbox{background:#fff;border-radius:18px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.order{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#fff}.badge{display:inline-block;background:#e8f5ed;color:#176b37;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:700}.notice{background:#fff8e6;border:1px solid #f0d68b;padding:12px;border-radius:12px;color:#634b12;font-size:13px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd6e5;border-radius:10px;margin:6px 0 14px;font:inherit}label{font-weight:700;font-size:14px}.muted{color:#65738a;font-size:14px}footer{text-align:center;padding:30px;color:#64748b}
</style></head><body>
<header><div class="logo">Qoopza<span>.</span></div><div class="actions"><button class="secondary" onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</button><button class="secondary" onclick="showOrders()">My Orders</button><button class="secondary" onclick="showAdmin()">Admin</button></div></header>
<main><section class="hero"><h1>Find your everyday favourites.</h1><p>Explore useful picks across tech, fashion and more.</p><button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})" style="background:#fff;color:#1556a4">Shop products →</button></section><div class="sectionhead"><h2 id="products">Shop products</h2><span class="muted">Sample products — replace with your inventory</span></div><div class="grid" id="productGrid"></div></main><footer>© <span id="year"></span> Qoopza.</footer>
<div class="modal hidden" id="modal"><div class="modalbox"><div class="sectionhead"><h2 id="modalTitle">Cart</h2><button class="secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const products=[{id:1,name:"Wireless Headphones",category:"Electronics",price:799,icon:"🎧"},{id:2,name:"Everyday T-Shirt",category:"Fashion",price:399,icon:"👕"},{id:3,name:"Smart Watch",category:"Electronics",price:1299,icon:"⌚"},{id:4,name:"Backpack",category:"Accessories",price:649,icon:"🎒"}];
let cart=JSON.parse(localStorage.getItem("qz_cart")||"[]");const money=n=>"₹"+Number(n).toLocaleString("en-IN");const saveCart=()=>{localStorage.setItem("qz_cart",JSON.stringify(cart));document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0)};
function render(){document.getElementById("productGrid").innerHTML=products.map(p=>`<article class="card"><div class="product-icon">${p.icon}</div><p class="muted">${p.category}</p><h3>${p.name}</h3><div class="price">${money(p.price)}</div><button onclick="add(${p.id})">Add to cart</button></article>`).join("");saveCart()}
function add(id){let x=cart.find(i=>i.id===id);x?x.qty++:cart.push({id,qty:1});saveCart()}
function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.remove("hidden")}function closeModal(){document.getElementById("modal").classList.add("hidden")}
function showCart(){let total=cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0);let rows=cart.map(i=>{let p=products.find(p=>p.id===i.id);return `<div class="order"><b>${p.name}</b> — ${money(p.price)} × ${i.qty}<div class="actions"><button class="secondary" onclick="changeQty(${i.id},-1)">−</button><button class="secondary" onclick="changeQty(${i.id},1)">+</button><button class="secondary" onclick="removeItem(${i.id})">Remove</button></div></div>`}).join("");openModal("Your cart",`${rows||"<p>Your cart is empty.</p>"}<h3>Total: ${money(total)}</h3>${cart.length?'<button onclick="checkout()">Proceed to checkout</button>':""}`)}
function changeQty(id,n){let x=cart.find(i=>i.id===id);x.qty+=n;if(x.qty<1)cart=cart.filter(i=>i.id!==id);saveCart();showCart()}function removeItem(id){cart=cart.filter(i=>i.id!==id);saveCart();showCart()}
function checkout(){if(!cart.length)return;let total=cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0);openModal("Checkout",`<form id="checkoutForm" onsubmit="placeOrder(event)"><label>Customer name</label><input name="name" required maxlength="70"><label>Phone number</label><input name="phone" required inputmode="tel" pattern="[0-9]{10}" placeholder="10-digit mobile number"><label>Delivery address</label><textarea name="address" required maxlength="300"></textarea><label>Payment method</label><select name="payment"><option value="COD">Cash on Delivery</option><option value="UPI">UPI (demo selection only)</option></select><div class="notice">Demo only: this website does not process or verify payments and does not send orders to a server. Never enter UPI PIN, OTP, card details or passwords here.</div><h3>Order total: ${money(total)}</h3><button type="submit">Place demo order</button></form>`)}
function placeOrder(e){e.preventDefault();let f=new FormData(e.target),total=cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0);let order={id:"QZ"+Date.now().toString().slice(-8),date:new Date().toLocaleString(),name:f.get("name"),phone:f.get("phone"),address:f.get("address"),payment:f.get("payment"),status:"Received (demo)",total,items:cart.map(i=>({...i,name:products.find(p=>p.id===i.id).name,price:products.find(p=>p.id===i.id).price}))};let orders=JSON.parse(localStorage.getItem("qz_orders")||"[]");orders.unshift(order);localStorage.setItem("qz_orders",JSON.stringify(orders));cart=[];saveCart();let msg=order.payment==="UPI"?"UPI selected, but no payment is collected or verified in this demo.":"Pay cash on delivery in this demo.";openModal("Demo order created",`<span class="badge">Order ${order.id}</span><h3>${money(total)}</h3><p>${msg}</p><p class="muted">Saved only in this browser on this device. The shop owner will not receive it.</p><button onclick="showOrders()">View my orders</button>`)}
function showOrders(){let a=JSON.parse(localStorage.getItem("qz_orders")||"[]");openModal("My orders",a.length?a.map(o=>`<div class="order"><b>${o.id}</b> <span class="badge">${o.status}</span><p>${o.date} · ${money(o.total)} · ${o.payment}</p><p>${o.items.map(i=>i.name+" × "+i.qty).join(", ")}</p></div>`).join(""):"<p>No orders saved on this device yet.</p>")}
function showAdmin(){openModal("Admin — local demo",`<div class="notice">Not a secure admin panel. It can only see demo orders saved in this same browser/device. Do not use with real customer data.</div><p>A real admin panel needs server-side login, database permissions and verified payment callbacks.</p><button onclick="adminOrders()">View local demo orders</button>`)}
function adminOrders(){let a=JSON.parse(localStorage.getItem("qz_orders")||"[]");openModal("Local demo orders",a.length?a.map(o=>`<div class="order"><b>${o.id}</b><p>${o.name} · ${o.phone}</p><p>${o.address}</p><p>${o.payment} · ${money(o.total)}</p><label>Demo status</label><select onchange="setStatus('${o.id}',this.value)"><option>Received (demo)</option><option>Processing (demo)</option><option>Shipped (demo)</option><option>Delivered (demo)</option><option>Cancelled (demo)</option></select></div>`).join(""):"<p>No local orders.</p>")}
function setStatus(id,status){let a=JSON.parse(localStorage.getItem("qz_orders")||"[]");let o=a.find(x=>x.id===id);if(o){o.status=status;localStorage.setItem("qz_orders",JSON.stringify(a))}}
document.getElementById("year").textContent=new Date().getFullYear();render();
</script></body></html>
